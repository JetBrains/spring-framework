plugins {
	id 'java-gradle-plugin'
	id 'checkstyle'
}

ext {
	def propertiesFile = new File(new File("$projectDir").parentFile, "gradle.properties")
	propertiesFile.withInputStream {
		def properties = new Properties()
		properties.load(it)
		set("kotlin_version", project.properties['kotlin_version'] ?: properties["kotlin_version"])
		set("kotlin_repo_url", project.properties['kotlin_repo_url'] ?: properties["kotlin_repo_url"])
	}
}

repositories {
	mavenCentral()
	gradlePluginPortal()
	def kotlinRepoUrl = project.findProperty('kotlin_repo_url')
	def kotlinVersion = project.findProperty('kotlin_version')
	if (kotlinRepoUrl && kotlinVersion) {
		exclusiveContent {
			forRepository {
				maven { url = kotlinRepoUrl }
			}
			filter {
				includeVersionByRegex("org.jetbrains.kotlin.*", ".*", kotlinVersion)
			}
		}
	}
}

dependencies {
	checkstyle "io.spring.javaformat:spring-javaformat-checkstyle:${javaFormatVersion}"
	implementation "org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlin_version}"
	implementation "org.jetbrains.dokka:dokka-gradle-plugin:2.2.0"
	implementation "com.tngtech.archunit:archunit:1.4.1"
	implementation "org.gradle:test-retry-gradle-plugin:1.6.2"
	implementation "io.spring.javaformat:spring-javaformat-gradle-plugin:${javaFormatVersion}"
	implementation "io.spring.nohttp:nohttp-gradle:0.0.11"

	testImplementation("org.assertj:assertj-core:${assertjVersion}")
	testImplementation(platform("org.junit:junit-bom:${junitVersion}"))
	testImplementation("org.junit.jupiter:junit-jupiter")
	testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

gradlePlugin {
	plugins {
		architecturePlugin {
			id = "org.springframework.architecture"
			implementationClass = "org.springframework.build.architecture.ArchitecturePlugin"
		}
		conventionsPlugin {
			id = "org.springframework.build.conventions"
			implementationClass = "org.springframework.build.ConventionsPlugin"
		}
		localDevPlugin {
			id = "org.springframework.build.localdev"
			implementationClass = "org.springframework.build.dev.LocalDevelopmentPlugin"
		}
		multiReleasePlugin {
			id = "org.springframework.build.multiReleaseJar"
			implementationClass = "org.springframework.build.multirelease.MultiReleaseJarPlugin"
		}
        repositoriesPlugin {
            id = "org.springframework.build.repositories"
            implementationClass = "org.springframework.build.RepositoriesPlugin"
        }
		optionalDependenciesPlugin {
			id = "org.springframework.build.optional-dependencies"
			implementationClass = "org.springframework.build.optional.OptionalDependenciesPlugin"
		}
		runtimeHintsAgentPlugin {
			id = "org.springframework.build.runtimehints-agent"
			implementationClass = "org.springframework.build.hint.RuntimeHintsAgentPlugin"
		}
	}
}

test {
	useJUnitPlatform()
}

jar.dependsOn check
